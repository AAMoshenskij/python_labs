[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-intake"
version = "0.1.0"
description = "ЛР 1: приём работ онлайн-школы и расширяемые анализаторы (Python Core)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
school-intake = "school_intake.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
school_intake = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["school_intake", "conftest"]
